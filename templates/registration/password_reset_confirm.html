{% extends 'base.html' %}{% block content %}<section class="auth-wrap"><form method="post" class="auth-card">{% csrf_token %}<span class="eyebrow">Nova senha</span><h1>Defina uma nova senha</h1>{% if validlink %}{{ form.as_p }}<button class="cta">Salvar nova senha</button>{% else %}<p>Este link é inválido ou já expirou. Solicite uma nova recuperação.</p><a class="cta" href="{% url 'password_reset' %}">Solicitar novo link</a>{% endif %}</form></section>{% endblock %}
