<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Nossas Delícias{% endblock %}</title>
  <style>
    :root{--bg:#f7f1e8;--paper:#fffaf4;--ink:#2a1712;--muted:#725f57;--accent:#b9693f;--line:#e2d5c9;--ok:#256d48}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.top{position:sticky;top:0;z-index:20;background:rgba(247,241,232,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.top .wrap{height:72px;display:flex;align-items:center;gap:24px}.brand{font:700 20px Georgia,serif}.nav{display:flex;gap:18px;margin-left:auto;align-items:center}.pill,.btn{border:0;border-radius:999px;padding:11px 17px;font-weight:700;cursor:pointer}.btn{background:var(--ink);color:#fff}.pill{border:1px solid var(--line);background:var(--paper)}main{min-height:70vh}.hero{padding:72px 0 38px}.hero h1{font:700 clamp(42px,7vw,76px)/.98 Georgia,serif;max-width:850px;margin:0}.hero p{max-width:650px;color:var(--muted);font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px}.card h3{font:700 25px Georgia,serif;margin:4px 0 10px}.muted{color:var(--muted)}.price{font-weight:800;font-size:18px}.section{padding:42px 0}.section h2{font:700 38px Georgia,serif}.orders{display:grid;gap:12px}.order{display:flex;justify-content:space-between;gap:18px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px}.status{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.chat{height:360px;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;align-content:start;gap:10px}.msg{max-width:78%;padding:10px 13px;background:#efe1d5;border-radius:14px}.msg.me{margin-left:auto;background:var(--ink);color:white}.chat-form{display:flex;gap:8px;margin-top:10px}.chat-form input{flex:1;padding:13px;border:1px solid var(--line);border-radius:999px;background:white}.form{max-width:480px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px}.form input{width:100%;padding:12px;margin:6px 0 14px;border:1px solid var(--line);border-radius:10px}footer{border-top:1px solid var(--line);margin-top:64px;padding:28px 0;color:var(--muted)}@media(max-width:780px){.grid{grid-template-columns:1fr}.nav a:not(.important){display:none}.hero{padding-top:44px}.order{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="{% url 'home' %}">Nossas Delícias</a><nav class="nav"><a class="important" href="{% url 'home' %}">Cardápio</a>{% if user.is_authenticated %}<a class="important" href="{% url 'account' %}">Meus pedidos</a>{% if user.is_staff %}<a class="pill" href="/controle-interno/">Central</a>{% endif %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="pill" type="submit">Sair</button></form>{% else %}<a class="pill" href="{% url 'login' %}">Entrar</a>{% endif %}</nav></div></header>
<main>{% block content %}{% endblock %}</main>
<footer><div class="wrap">Nossas Delícias • pedidos, cafeterias e eventos</div></footer>
{% block scripts %}{% endblock %}
</body></html>
