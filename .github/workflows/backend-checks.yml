name: Backend checks
on:
  push:
    branches: [main, feature/full-commerce-platform]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate initial store migration
        env:
          DEBUG: '1'
        run: |
          mkdir -p store/migrations
          touch store/migrations/__init__.py
          python manage.py makemigrations store --no-header
          echo '__MIGRATION_START__'
          cat store/migrations/0001_initial.py
          echo '__MIGRATION_END__'
      - run: python manage.py check
        env:
          DEBUG: '1'
      - run: python manage.py migrate --noinput
        env:
          DEBUG: '1'
      - run: python manage.py test
        env:
          DEBUG: '1'
