name: Backend checks
on:
  push:
    branches: [main, feature/full-commerce-platform]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Run Django checks/tests with the same staticfiles backend used by production.
      # DEMO_MODE keeps CI self-contained while DEBUG=0 exercises the manifest path.
      DEBUG: '0'
      DEMO_MODE: '1'
      DJANGO_SECRET_KEY: 'ci-only-secret-key-not-used-in-production'
      DISABLE_HTTPS_REDIRECT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q config store
      - name: Validate frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find static -type f -name '*.js' -print0)
      - name: Validate ASGI startup
        run: python -c "import config.asgi; assert config.asgi.application"
      - name: Ensure migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Django system check
        run: python manage.py check
      - name: Apply migrations from scratch
        run: python manage.py migrate --noinput
      - name: Build production static assets and manifest
        run: python manage.py collectstatic --noinput --clear
      - name: Run test suite against the production static backend
        run: python manage.py test
