name: Backend checks
on:
  push:
    branches: [main, feature/full-commerce-platform]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q config store
      - name: Validate frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find static -type f -name '*.js' -print0)
      - name: Validate ASGI startup
        env:
          DEBUG: '1'
        run: python -c "import config.asgi; assert config.asgi.application"
      - name: Ensure migrations are committed
        env:
          DEBUG: '1'
        run: python manage.py makemigrations --check --dry-run
      - name: Django system check
        env:
          DEBUG: '1'
        run: python manage.py check
      - name: Apply migrations from scratch
        env:
          DEBUG: '1'
        run: python manage.py migrate --noinput
      - name: Build static assets
        env:
          DEBUG: '1'
        run: python manage.py collectstatic --noinput --clear
      - name: Run test suite
        env:
          DEBUG: '1'
        run: python manage.py test
