name: Migration preview
on:
  push:
    branches: [feature/full-commerce-platform]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate migration
        env:
          DEBUG: '1'
        run: |
          mkdir -p store/migrations
          touch store/migrations/__init__.py
          python manage.py makemigrations store --no-header
      - name: Print migration
        run: |
          echo '__MIGRATION_START__'
          cat store/migrations/0001_initial.py
          echo '__MIGRATION_END__'
