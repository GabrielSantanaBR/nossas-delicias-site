name: Bootstrap management migration
on:
  push:
    branches: [feature/full-commerce-platform]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip mgmt migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-commerce-platform
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate and version migration
        env:
          DEBUG: '1'
        run: |
          python manage.py makemigrations store --no-header
          if git diff --quiet -- store/migrations; then
            echo 'No migration changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add store/migrations
          git commit -m 'chore: add management database migration [skip mgmt migration]'
          git push origin HEAD:feature/full-commerce-platform
