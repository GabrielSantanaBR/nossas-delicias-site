name: Bootstrap migrations
on:
  push:
    branches: [feature/full-commerce-platform]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[skip migration bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-commerce-platform
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate and version initial migration when missing
        env:
          DEBUG: '1'
        run: |
          if [ -f store/migrations/0001_initial.py ]; then
            echo 'Initial migration already versioned.'
            exit 0
          fi
          mkdir -p store/migrations
          touch store/migrations/__init__.py
          python manage.py makemigrations store --no-header
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add store/migrations/__init__.py store/migrations/0001_initial.py
          git commit -m 'chore: version initial Django migration [skip migration bootstrap]'
          git push origin HEAD:feature/full-commerce-platform
