services:
  - type: web
    name: nossas-delicias
    runtime: python
    branch: main
    plan: free
    region: oregon
    buildCommand: ./build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "0"
      - key: DEMO_MODE
        value: "0"
      - key: HSTS_PRELOAD
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nossas-delicias-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nossas-delicias-cache
          property: connectionString
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_ANALYTICS_MEASUREMENT_ID
        sync: false
      - key: PRIVACY_POLICY_VERSION
        value: "2026-09-05"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_DOMAIN
        sync: false

  - type: keyvalue
    name: nossas-delicias-cache
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: nossas-delicias-db
    plan: free
    region: oregon
    databaseName: nossas_delicias
    user: nossas_delicias
